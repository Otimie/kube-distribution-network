# Example configuration.
#
# The proxy is read-only and deny-by-default. It reads the cluster with its own
# service account while edge clients are unauthenticated, so anything in `rules`
# is readable by anyone who can reach the proxy. Put nothing there whose
# contents you would not publish.

listen: ":8080"
adminListen: ":9090"

upstream:
  server: "https://kubernetes.default.svc"
  caFile: "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
  tokenFile: "/var/run/secrets/kubernetes.io/serviceaccount/token"
  timeout: "30s"

# Optional TLS on `listen`, for the hop between the CDN and this origin. Leave
# certFile and keyFile empty to serve plain HTTP. The files are re-read when they
# change, so rotation needs no restart. The admin port is always plain HTTP.
tls:
  certFile: ""   # e.g. /etc/kdn-tls/tls.crt
  keyFile: ""    # e.g. /etc/kdn-tls/tls.key
  # Setting this turns on mutual TLS: connections without a client certificate
  # signed by this CA are refused, so only the CDN can reach the origin.
  clientCAFile: ""   # e.g. /etc/kdn-tls/client-ca.crt

# Optional CORS, so a browser page on another origin can read responses. Empty
# means off. One origin, or "*" for any; there is no list, because responses
# varying by Origin would be mixed up by the CDN cache.
cors:
  allowedOrigin: ""   # e.g. https://dashboard.example.com
  # Send Access-Control-Allow-Credentials: true, for pages that fetch with
  # credentials (e.g. Headlamp). Needs a specific allowedOrigin, not "*".
  allowCredentials: false

# Total body budget for the response cache.
cacheMaxBytes: 536870912 # 512 MiB

# Ceiling on simultaneous requests to the API server. With request coalescing,
# this is what bounds API server load however much traffic arrives at the edge.
upstreamConcurrency: 32

# Readable resources. `ttl` becomes max-age: a 30s ttl means the API server sees
# at most a couple of requests a minute for that resource, whatever the fleet
# size.
rules:
  - group: ""
    version: v1
    resource: nodes
    ttl: "30s"

  - group: ""
    version: v1
    resource: services
    ttl: "30s"

  # Restricting namespaces also refuses cluster-wide reads of this resource,
  # since those would return objects from every namespace.
  - group: ""
    version: v1
    resource: configmaps
    namespaces: ["public", "fleet-*"]
    ttl: "60s"

  - group: apps
    version: v1
    resource: deployments
    ttl: "30s"

  # requireLabels publishes only objects that carry these labels: lists are
  # filtered by the API server, and a read by name of an unlabelled object gets
  # the same 404 as a missing one. Opt objects in with
  # `kubectl label namespace default kdn.io/public=true`. Anyone who can update
  # an object can label it, so guard the label (see the README).
  # - group: ""
  #   version: v1
  #   resource: namespaces
  #   requireLabels:
  #     kdn.io/public: "true"
  #   ttl: "60s"

# Deliberately absent: secrets, serviceaccounts, and anything else whose
# contents are credentials.
